[package]
name = "bsc-launchpad-recorder"
version = "0.1.0"
edition = "2021"
description = "Records four.meme and Flap token launches, trades, graduations and pool prices on BNB Chain into PostgreSQL"
license = "MIT"
readme = "README.md"
publish = false

# One TLS stack everywhere (rustls with the `ring` provider): mixing providers
# in one process makes rustls panic at the first handshake.
[dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"

[profile.release]
debug = 1
