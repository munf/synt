<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>synt · audit terminal</title>
    <meta name="description" content="synt is a Solana trading terminal that scores every new pair in its first minutes, so traders can see which launches are likely to rug before they buy." />
    <!-- Produk berbayar, bukan halaman marketing: jangan diindeks. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- ⭐ U21 (audit 7 Nov): sebelum JS jalan. (1) Pilih kerangka isi (`data-rute`, lihat <body> & styles/kerangka.css).
         (2) Rute Trenches: minta feed tampilan aktif SEKARANG (`preload as=fetch`), tidak menunggu JS + potongan rute
         selesai. URL WAJIB sama persis dgn permintaan pertama aplikasi (routes/Trenches.tsx: chain & view dari URL,
         lalu nilai tersimpan `synt.trenches.*`; api/client.ts `trenches` / `bnbTrenches`, limit 50), kalau tidak
         browser mengunduh dua kali. '/' dialihkan ke /trenches TANPA query (spt main.tsx). -->
    <!-- kerangka hanya tampil bila CSS aplikasi sudah ada (styles/kerangka.css membukanya); tanpa CSS = tak ada markup
         polos yang berkedip (dev server menyuntik CSS lewat JS, atau stylesheet gagal diunduh) -->
    <style>[data-kerangka] { visibility: hidden; }</style>
    <script>
      (function () {
        try {
          var d = document.documentElement, p = location.pathname
          var simpan = function (k) { try { return JSON.parse(localStorage.getItem(k)) } catch (e) { return null } }
          if (p === '/' || p === '/trenches') {
            // '/' = <Navigate to="/trenches" replace /> (main.tsx) dilakukan di sini lebih dulu: tanpa ini React sempat
            // melukis shell dgn isi kosong sebelum pengalihan, membuang kerangka. URL & riwayat sama (replace, tanpa query).
            if (p === '/') history.replaceState(history.state, '', '/trenches')
            d.setAttribute('data-rute', 'trenches')
            if (simpan('synt.trenches.panel') === false) d.setAttribute('data-panel', 'tutup')
            var q = new URLSearchParams(p === '/' ? '' : location.search), c = q.get('chain'), v = q.get('view'), url
            var chain = c === 'bnb' || c === 'sol' ? c : simpan('synt.trenches.chain') === 'bnb' ? 'bnb' : 'sol'
            d.setAttribute('data-chain', chain)
            var muat = function (u) {
              var l = document.createElement('link')
              l.rel = 'preload'
              l.as = 'fetch'
              l.crossOrigin = 'anonymous'
              l.href = u
              document.head.appendChild(l)
            }
            if (chain === 'bnb') {
              if (v !== 'new' && v !== 'graduated') v = simpan('synt.trenches.bnbView') === 'graduated' ? 'graduated' : 'new'
              muat('/api/bnb/trenches?view=' + v + '&limit=50')
              // kalibrasi BNB (chip Provisional di kepala SCORE, warna skor): dulu tiba belakangan → kepala tabel +21 px
              muat('/api/bnb/calibration')
            } else {
              var sol = ['new', 'trending', 'bonding', 'graduated']
              if (sol.indexOf(v) < 0) v = simpan('synt.trenches.view')
              if (sol.indexOf(v) < 0) v = 'new'
              muat('/api/trenches?view=' + v + '&limit=50')
            }
          } else if (/^\/(coin|bnb)\/[^/]+\/?$/.test(p)) {
            d.setAttribute('data-rute', 'token')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- ⭐ U21: kerangka statis (tanpa JS, warna & ukuran dari CSS aplikasi yang sudah dimuat di <head>): topbar, footer

         alih tak ada yang melompat. Isi rute dipindah utuh ke fallback rute pertama (main.tsx `KerangkaAwal`) sampai
         potongan rute siap. Diganti seluruhnya oleh React; jangan menaruh apa pun yang interaktif di sini. -->

                    <div class="pt-row is-skeleton"><span class="pt-token"><i class="pt-sk pt-sk-av"></i><i class="pt-sk pt-sk-l"></i></span><span><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="ta-r"><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="pt-actions"><i class="pt-sk pt-sk-buy"></i></span></div>
                    <div class="pt-row is-skeleton"><span class="pt-token"><i class="pt-sk pt-sk-av"></i><i class="pt-sk pt-sk-l"></i></span><span><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="ta-r"><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="pt-actions"><i class="pt-sk pt-sk-buy"></i></span></div>
                    <div class="pt-row is-skeleton"><span class="pt-token"><i class="pt-sk pt-sk-av"></i><i class="pt-sk pt-sk-l"></i></span><span><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="ta-r"><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="pt-actions"><i class="pt-sk pt-sk-buy"></i></span></div>
                    <div class="pt-row is-skeleton"><span class="pt-token"><i class="pt-sk pt-sk-av"></i><i class="pt-sk pt-sk-l"></i></span><span><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="ta-r"><i class="pt-sk"></i></span><span><i class="pt-sk"></i></span><span class="pt-actions"><i class="pt-sk pt-sk-buy"></i></span></div>
                  </div>
                </div>

          </div>
        </div>
        <section class="page" data-untuk="token" aria-hidden="true">
          <div class="cd tv tv-skel">
            <header class="cd-head">
              <div class="cd-identity"><i class="sk sk-av"></i><i class="sk sk-l"></i></div>

      </main>
      <footer class="eb"><div class="eb-bar"></div></footer>

    <script type="module" src="/src/main.tsx"></script>
